
name: Build StoryRaft APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/StoryRaft-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryRaft-debug-apk
          path: StoryRaft-debug.apk
          if-no-files-found: error
