
name: Build StoryRaft APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found in repository root."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryRaft-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
