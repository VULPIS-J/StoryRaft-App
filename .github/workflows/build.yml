name: Build StoryRaft Android

on:
  workflow_dispatch:
  push:
    paths:
      - "StoryRaft-Android.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project ZIP
        run: |
          test -f StoryRaft-Android.zip
          mkdir -p extracted
          unzip -q StoryRaft-Android.zip -d extracted
          test -f extracted/StoryRaft-Android/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/StoryRaft-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryRaft-debug-apk
          path: extracted/StoryRaft-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
