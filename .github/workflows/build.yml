name: Build StoryRaft Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          if [ -f StoryRaft-Android.zip ]; then
            echo "Using StoryRaft-Android.zip"
            unzip -q StoryRaft-Android.zip -d extracted
          elif [ -f StoryRaft-Android-GitHub.zip ]; then
            echo "Using StoryRaft-Android-GitHub.zip"
            unzip -q StoryRaft-Android-GitHub.zip -d extracted
          else
            echo "No project ZIP found at repository root."
            ls -la
            exit 1
          fi
          if [ -d extracted/StoryRaft-Android ]; then
            PROJECT_DIR="extracted/StoryRaft-Android"
          elif [ -f extracted/settings.gradle.kts ]; then
            PROJECT_DIR="extracted"
          else
            echo "Extracted archive does not contain an Android project."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryRaft-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
